<div class="auth__card">
  <h1 class="auth__title">Connexion</h1>
  <p class="auth__subtitle">Accédez à l'administration de la plateforme.</p>

  @if (messageErreur()) {
    <p class="auth-error" role="alert">
      <i class="auth-error__icon fa-solid fa-circle-exclamation" aria-hidden="true"></i>
      <span>{{ messageErreur() }}</span>
    </p>
  }

  <form [formGroup]="formulaire" (ngSubmit)="soumettre()" novalidate>
    <div class="form-group">
      <label for="identifiant">Identifiant ou adresse e-mail</label>
      <input
        id="identifiant"
        class="form-control"
        type="text"
        formControlName="identifiant"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        [attr.aria-invalid]="estInvalide('identifiant')"
        [attr.aria-describedby]="estInvalide('identifiant') ? 'erreur-identifiant' : null"
      />
      @if (estInvalide('identifiant')) {
        <span class="form-error" id="erreur-identifiant">
          Saisissez votre identifiant.
        </span>
      }
    </div>

    <div class="form-group">
      <label for="motDePasse">Mot de passe</label>
      <div class="password-field">
        <input
          id="motDePasse"
          class="form-control"
          [type]="motDePasseVisible() ? 'text' : 'password'"
          formControlName="motDePasse"
          autocomplete="current-password"
          [attr.aria-invalid]="estInvalide('motDePasse')"
          [attr.aria-describedby]="estInvalide('motDePasse') ? 'erreur-motdepasse' : null"
        />
        <button
          type="button"
          class="password-field__toggle"
          (click)="motDePasseVisible.set(!motDePasseVisible())"
          [attr.aria-label]="
            motDePasseVisible() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'
          "
          [attr.aria-pressed]="motDePasseVisible()"
        >
          <i
            class="fa-solid"
            [class.fa-eye]="!motDePasseVisible()"
            [class.fa-eye-slash]="motDePasseVisible()"
            aria-hidden="true"
          ></i>
        </button>
      </div>
      @if (estInvalide('motDePasse')) {
        <span class="form-error" id="erreur-motdepasse">
          Le mot de passe doit comporter au moins 6 caractères.
        </span>
      }
    </div>

    <button type="submit" class="btn btn-primary auth__submit" [disabled]="enCours()">
      @if (enCours()) {
        <i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i>
        Connexion…
      } @else {
        Se connecter
      }
    </button>
  </form>
</div>
