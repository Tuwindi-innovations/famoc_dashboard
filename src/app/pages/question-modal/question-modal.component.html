<div class="modal-header">
  <h2 class="modal-title">{{ donnees.titre }}</h2>
  <button
    type="button"
    class="close"
    (click)="activeModal.dismiss()"
    aria-label="Fermer"
  >
    <span aria-hidden="true">&times;</span>
  </button>
</div>

<div class="modal-body">
  <form [formGroup]="questionForm">
    <div class="form-group mb-3">
      <label>Texte de la question</label>
      <textarea
        class="form-control"
        formControlName="texte"
        rows="2"
      ></textarea>
    </div>

    <div class="row">
      <div class="col-md-6">
        <div class="form-group mb-3">
          <label>Type de question</label>
          <select class="form-control" formControlName="type">
            <option value="QCM">QCM (Choix multiple)</option>
            <option value="VRAI_FAUX">Vrai / Faux</option>
            <option value="REPONSE_COURTE">Réponse courte</option>
          </select>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group mb-3">
          <label>Points</label>
          <input type="number" class="form-control" formControlName="points" />
        </div>
      </div>
    </div>

    <h5 class="border-bottom pb-2 mt-4">Options de réponse</h5>
    <div formArrayName="reponseOptions">
      @for (opt of options.controls; track opt; let i = $index) {
      <div [formGroupName]="i" class="card p-2 mb-2">
        <div class="d-flex align-items-center">
          <input
            type="text"
            class="form-control form-control-sm mr-2"
            formControlName="texte"
            placeholder="Réponse {{ i + 1 }}"
          />
          <div class="custom-control custom-checkbox mr-3">
            <input
              type="checkbox"
              class="custom-control-input"
              [id]="'check' + i"
              formControlName="estCorrecte"
            />
            <label class="custom-control-label" [for]="'check' + i"
              >Correcte</label
            >
          </div>
          <button
            type="button"
            class="btn btn-sm btn-outline-danger"
            (click)="retirerOption(i)"
            [disabled]="options.length <= 2"
          >
            <i class="fas fa-trash-can" aria-hidden="true"></i>
          </button>
        </div>
      </div>
      }
    </div>

    <button
      type="button"
      class="btn btn-secondary btn-sm mt-2"
      (click)="ajouterOption()"
    >
      <i class="fas fa-plus" aria-hidden="true"></i> Ajouter une option
    </button>
  </form>
</div>

<div class="modal-footer">
  <button
    type="button"
    class="btn btn-secondary"
    (click)="activeModal.dismiss()"
  >
    Annuler
  </button>
  <button
    type="button"
    class="btn btn-primary"
    (click)="soumettre()"
  >
    {{ donnees.edition ? "Enregistrer les modifications" : "Ajouter la question" }}
  </button>
</div>
