<nav
  class="navbar navbar-vertical fixed-left navbar-expand-md navbar-light bg-white"
  id="sidenav-main"
>
  <div class="container-fluid">
    <button
      class="navbar-toggler"
      type="button"
      (click)="basculer()"
      [attr.aria-expanded]="!replie()"
      aria-controls="sidenav-collapse-main"
      aria-label="Afficher la navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <a class="navbar-brand pt-0" [routerLink]="['/dashboard']">
      <img
        src="./assets/img/brand/famocLogo.png"
        class="navbar-brand-img"
        alt="FAMOC"
      />
    </a>

    <div
      class="collapse navbar-collapse"
      [ngbCollapse]="replie()"
      id="sidenav-collapse-main"
    >
      <div class="navbar-collapse-header d-md-none">
        <div class="row">
          <div class="col-6 collapse-brand">
            <a [routerLink]="['/dashboard']">
              <img src="./assets/img/brand/famocLogo.png" alt="FAMOC" />
            </a>
          </div>
          <div class="col-6 collapse-close">
            <button
              type="button"
              class="navbar-toggler"
              (click)="basculer()"
              aria-label="Fermer la navigation"
            >
              <span></span>
              <span></span>
            </button>
          </div>
        </div>
      </div>

      @for (groupe of navigation; track groupe.titre) {
        @if (groupe.titre) {
          <hr class="my-3" />
          <h6 class="navbar-heading text-muted">{{ groupe.titre }}</h6>
        }
        <ul class="navbar-nav">
          @for (element of groupe.elements; track element.chemin) {
            <li class="nav-item">
              <a
                class="nav-link"
                [routerLink]="[element.chemin]"
                routerLinkActive="active"
                #lien="routerLinkActive"
                [attr.aria-current]="lien.isActive ? 'page' : null"
                (click)="fermer()"
              >
                <i class="ni {{ element.icone }} text-primary"></i>
                <span class="nav-link-text">{{ element.titre }}</span>
              </a>
            </li>
          }
        </ul>
      }

      <hr class="my-3" />
      <ul class="navbar-nav">
        <li class="nav-item">
          <button type="button" class="nav-link btn btn-link text-left w-100" (click)="deconnecter()">
            <i class="ni ni-user-run text-danger"></i>
            <span class="nav-link-text">Déconnexion</span>
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>
