<aside class="sidebar" [attr.data-open]="ouvert()">
  <a class="sidebar__brand" [routerLink]="['/dashboard']">
    <img
      class="sidebar__logo"
      ngSrc="assets/img/brand/famocLogo.png"
      width="40"
      height="28"
      priority
      alt="FAMOC"
    />
    <span class="sidebar__brand-text">Administration</span>
  </a>

  <nav class="sidebar__nav" aria-label="Navigation principale">
    @for (groupe of navigation; track groupe.titre) {
      <div class="sidebar__group">
        @if (groupe.titre) {
          <h2 class="sidebar__group-title">{{ groupe.titre }}</h2>
        }
        <ul class="sidebar__list">
          @for (element of groupe.elements; track element.chemin) {
            <li>
              <a
                class="sidebar__link"
                [routerLink]="[element.chemin]"
                routerLinkActive
                #lien="routerLinkActive"
                [attr.aria-current]="lien.isActive ? 'page' : null"
                (click)="fermer()"
              >
                <i class="sidebar__icon fa-solid {{ element.icone }}" aria-hidden="true"></i>
                {{ element.titre }}
              </a>
            </li>
          }
        </ul>
      </div>
    }
  </nav>

  <div class="sidebar__footer">
    <button type="button" class="sidebar__logout" (click)="deconnecter()">
      <i class="sidebar__icon fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>
      Déconnexion
    </button>
  </div>
</aside>
